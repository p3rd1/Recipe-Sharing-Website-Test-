 session</text><rect x="670" y="500" width="240" height="242" rx="18" fill="#f1edfa" stroke="#d0c4e7" stroke-width="1.6" /><text x="692" y="535" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#7859a6" font-weight="700" >4 · Models</text><text x="692" y="572" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#17324d" font-weight="600" >Entity classes từ EDMX</text><text x="692" y="602" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#17324d" font-weight="600" >ViewModels + Metadata</text><text x="692" y="632" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#17324d" font-weight="600" >CookingBabyDBEntities</text><text x="692" y="666" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5e7184" font-weight="500" >User · Recipe · Category…</text><text x="692" y="710" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#5e7184" font-weight="500" >Model chuyển dữ liệu giữa các tầng</text><rect x="980" y="500" width="240" height="242" rx="18" fill="#eef4f8" stroke="#becfdb" stroke-width="1.6" /><text x="1002" y="535" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#34495e" font-weight="700" >5 · Data access</text><text x="1002" y="572" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#17324d" font-weight="700" >Entity Framework 6</text><text x="1002" y="602" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#17324d" font-weight="600" >Database First · .edmx</text><text x="1002" y="632" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#17324d" font-weight="600" >DbContext / DbSet</text><text x="1002" y="675" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5e7184" font-weight="500" >LINQ + SQL Server provider</text><rect x="1285" y="500" width="360" height="242" rx="18" fill="#fff2e5" stroke="#e9c5a0" stroke-width="1.8" /><text x="1310" y="538" font-family="'Segoe UI', Arial, sans-serif" font-