="700" >Luồng dữ liệu:</text><text x="520" y="827" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#34495e" font-weight="600" >HTTP → Route → Controller → Service / Model → EF6 → SQL Server → Razor View → HTML</text><text x="405" y="852" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#5e7184" font-weight="500" >Đăng nhập lưu trạng thái trong Session; SessionAuthorizeAttribute bảo vệ các action yêu cầu xác thực.</text></svg>